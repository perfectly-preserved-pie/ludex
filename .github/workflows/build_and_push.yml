name: Build and Publish

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.gitignore'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: build-and-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'

      - name: Install locked dependencies and Chromium
        run: |
          uv sync --frozen
          uv run --frozen playwright install --with-deps chromium

      - name: Run unit and browser tests
        run: uv run --frozen pytest -q --run-browser

      - name: Audit production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/ludex-requirements.txt > /dev/null
          uv run --frozen pip-audit --disable-pip --require-hashes -r /tmp/ludex-requirements.txt

  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Login to Docker Hardened Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build image and push to Docker Hub
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: |
            strayingfromthepath/ludex:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          no-cache: true

      - name: Image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.docker_build.outputs.digest }}"
